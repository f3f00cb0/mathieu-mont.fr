# mathieu-mont.fr — configuration nginx (site statique à la racine du dépôt)

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Logs vers stdout/stderr (récupérés par Docker / Coolify)
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Sécurité ---
    # Le nouveau site charge ses polices chez Google et ses styles en ligne.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'self'; frame-ancestors 'none'" always;

    # Ancienne sous-page → site Relève
    location = /releve { return 301 https://releve.mathieu-mont.fr/; }
    location ^~ /releve/ { return 301 https://releve.mathieu-mont.fr/; }

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/html text/css application/javascript application/json image/svg+xml application/xml;

    # --- Endpoint de santé (utilisé par le healthcheck Docker) ---
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Cache des polices et images ---
    location ~* \.(?:woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --- HTML / CSS : jamais en cache dur (pour pousser les màj tout de suite) ---
    # add_header dans un location remplace les en-têtes du server, donc on les répète.
    error_page 404 /404.html;
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
