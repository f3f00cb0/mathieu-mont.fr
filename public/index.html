<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathieu Mont</title>
<link rel="preload" href="/fonts/fraunces-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Polices auto-hébergées (Fontsource, sous-ensemble latin) */
  @font-face{
    font-family:"Fraunces";
    font-style:normal;
    font-weight:300 500;
    font-display:swap;
    src:url("/fonts/fraunces-opsz-normal.woff2") format("woff2");
  }
  @font-face{
    font-family:"Fraunces";
    font-style:italic;
    font-weight:300 500;
    font-display:swap;
    src:url("/fonts/fraunces-opsz-italic.woff2") format("woff2");
  }
  @font-face{
    font-family:"IBM Plex Mono";
    font-style:normal;
    font-weight:400;
    font-display:swap;
    src:url("/fonts/ibm-plex-mono-400.woff2") format("woff2");
  }

  :root{
    --paper:#f4f1ea;
    --ink:#1c1a17;
    --soft:#615b52;
    --faint:#a39b8d;
    --accent:#b23c2c;
    --rule:#ddd6c8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Fraunces",Georgia,serif;
    font-optical-sizing:auto;
    font-weight:340;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .page{
    max-width:560px;
    margin:0 auto;
    padding:clamp(64px,16vh,160px) clamp(24px,6vw,32px) 80px;
  }

  /* petite étiquette mono, le seul élément non-serif */
  .label{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--faint);
  }

  h1{
    font-size:clamp(40px,9vw,60px);
    font-weight:400;
    letter-spacing:-.02em;
    line-height:1;
    margin:14px 0 0;
  }

  .intro{
    margin-top:26px;
    font-size:clamp(19px,2.6vw,22px);
    line-height:1.55;
    max-width:32ch;
    color:var(--ink);
  }

  /* sélection */
  .works{
    margin-top:clamp(56px,11vh,96px);
  }
  .works .label{display:block;margin-bottom:20px}

  .work{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:16px 0;
    border-top:1px solid var(--rule);
  }
  .work:last-of-type{border-bottom:1px solid var(--rule)}
  .work .title{
    font-size:22px;
    font-weight:400;
    transition:color .25s;
  }
  .work .desc{
    margin-top:2px;
    font-size:15px;
    color:var(--soft);
    line-height:1.5;
  }
  .work:hover .title{color:var(--accent);font-style:italic}

  /* contact */
  .contact{
    margin-top:clamp(56px,11vh,96px);
  }
  .contact a{
    font-style:italic;
    font-size:clamp(26px,6vw,38px);
    color:var(--ink);
    text-decoration:none;
    background-image:linear-gradient(var(--accent),var(--accent));
    background-size:0% 1px;
    background-position:0 100%;
    background-repeat:no-repeat;
    transition:background-size .4s cubic-bezier(.16,1,.3,1),color .25s;
  }
  .contact a:hover{background-size:100% 1px;color:var(--accent)}

  /* apparition douce */
  body{opacity:0;animation:in .8s ease forwards}
  @keyframes in{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){body{animation:none;opacity:1}.work,.contact a{transition:none}}
</style>
</head>
<body>
  <main class="page">

    <span class="label">Saint-Étienne · Développeur</span>
    <h1>Mathieu Mont</h1>
    <p class="intro">Développeur Symfony. J'automatise des documents avec de l'IA.</p>

    <section class="works">
      <span class="label">Sélection</span>

      <!-- ===== À TOI DE JOUER =====
           Garde, supprime ou duplique un bloc <a class="work"> ci-dessous.
           Mets ce que TU veux mettre en avant. L'ordre = ton ordre.
      -->
      <a class="work" href="https://furan.run/" target="_blank" rel="noopener">
        <div class="title">Furan</div>
        <div class="desc">L'open data des transports stéphanois — bus, tram, Vélivert — réuni dans une seule API temps réel.</div>
      </a>
      <!-- ===== fin de la zone à remplir ===== -->

    </section>

    <section class="contact">
      <a href="mailto:bonjour@mathieu-mont.fr">bonjour@mathieu-mont.fr</a>
    </section>

  </main>
</body>
</html>
