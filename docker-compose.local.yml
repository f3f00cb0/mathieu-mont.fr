# Lance le portfolio sur http://localhost:8080
# et Relève sur http://localhost:8081
#
#   docker compose -f docker-compose.local.yml up --build
#
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
  releve:
    build:
      context: ./releve
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    restart: unless-stopped
