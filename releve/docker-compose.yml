# PROD Dokploy — Relève, à part de mathieu-mont.fr
#
# DNS : releve.mathieu-mont.fr (A/AAAA vers la même IP que le portfolio).
# Dans Dokploy : Create → Compose, Compose Path : releve/docker-compose.yml
# (si le projet Dokploy a pour racine ce dépôt).
#
# Pour un domaine à toi (releve.run, etc.) : change le Host ci-dessous.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: releve:latest
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.releve.rule=Host(`releve.mathieu-mont.fr`)
      - traefik.http.routers.releve.entrypoints=websecure
      - traefik.http.routers.releve.tls=true
      - traefik.http.routers.releve.tls.certresolver=letsencrypt
      - traefik.http.services.releve.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
